<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Daterbase</title>
<style>:root{--bg:#f6f4f0;--fg:#26231f;--mut:#78726a;--ac:#5b5bd6}@media (prefers-color-scheme:dark){:root{--bg:#18171a;--fg:#eceae6;--mut:#a29d96;--ac:#9a9af0}}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;word-break:keep-all}main{max-width:360px;padding:24px 18px;text-align:center}a.b{display:inline-block;margin-top:14px;padding:11px 20px;border-radius:999px;background:var(--ac);color:#fff;text-decoration:none;font-weight:700}p{color:var(--mut);margin:8px 0 0}</style></head>
<body><main><b style="font-size:19px">Daterbase 주소가 바뀌었어요</b><p>새 주소에서 동기화로 데이터를 불러와 주세요.</p><a class="b" id="go" href="https://app.daterbase.net/">새 주소로 가기</a></main>
<script>/* 옛 개인용 주소(맨 위) → 개인용 새 주소. 배포용(/share/)은 앱 안 이사 창이 데이터를 옮겨요. */
(function(){var me=/\/preview\//.test(location.pathname);/* 11-04 04 이사 끝: 맨 위·m.html도 배포용 새 주소로 */var d=(me?"https://me.daterbase.net/":"https://app.daterbase.net/share/")+location.search+location.hash;document.getElementById("go").href=d})()</script></body></html>
